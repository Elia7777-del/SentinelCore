services:
  api:
    build: ./backend
    environment:
      SENTINELCORE_ENVIRONMENT: ${SENTINELCORE_ENVIRONMENT:-production}
      SENTINELCORE_SECRET_KEY: ${SENTINELCORE_SECRET_KEY:?Set SENTINELCORE_SECRET_KEY}
      SENTINELCORE_DATABASE_URL: postgresql+psycopg://sentinelcore:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/sentinelcore
      SENTINELCORE_CORS_ORIGINS: ${SENTINELCORE_CORS_ORIGINS:-https://sentinelcore.example.com}
      SENTINELCORE_REQUIRE_HTTPS: ${SENTINELCORE_REQUIRE_HTTPS:-true}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentinelcore
      POSTGRES_USER: sentinelcore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - sentinelcore-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelcore -d sentinelcore"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  sentinelcore-db:
