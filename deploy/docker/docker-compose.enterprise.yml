services:
  api:
    build:
      context: ../../backend
    restart: unless-stopped
    env_file:
      - ../../.env.production
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 20s
      timeout: 5s
      retries: 5

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinelcore
      POSTGRES_USER: sentinelcore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - sentinelcore_db:/var/lib/postgresql/data
    expose:
      - "5432"
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelcore -d sentinelcore"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: nginx:1.29-alpine
    restart: unless-stopped
    volumes:
      - ../../web:/usr/share/nginx/html:ro
      - ../nginx/sentinelcore.conf.example:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "443:443"
      - "80:80"
    depends_on: [api]
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  sentinelcore_db:
